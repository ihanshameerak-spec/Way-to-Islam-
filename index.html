<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarifying Islam — Myths, Evidence & Trivia</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: #ccfbf1;
      --accent: #b45309;
      --correct-bg: #dcfce7;
      --correct-text: #166534;
      --wrong-bg: #fee2e2;
      --wrong-text: #991b1b;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #2dd4bf;
      --primary-hover: #14b8a6;
      --primary-soft: rgba(45, 212, 191, 0.15);
      --accent: #fbbf24;
      --correct-bg: rgba(22, 101, 52, 0.35);
      --correct-text: #86efac;
      --wrong-bg: rgba(153, 27, 27, 0.35);
      --wrong-text: #fca5a5;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .tab-btn, .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #0b1120;
      border-color: var(--primary);
    }

    [data-theme="light"] .tab-btn.active {
      color: #ffffff;
    }

    .tab-btn:hover:not(.active), .theme-btn:hover {
      border-color: var(--primary);
    }

    .hero {
      max-width: 960px;
      margin: 2rem auto 1.5rem;
      padding: 0 1.25rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .hero p {
      color: var(--muted);
      max-width: 640px;
      margin: 0 auto;
    }

    main {
      max-width: 960px;
      margin: 0 auto 4rem;
      padding: 0 1.25rem;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* FAQ & Da'wah Controls */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pill {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* FAQ & Da'wah Cards */
    .faq-list, .dawah-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .faq-card, .dawah-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }

    .faq-header, .dawah-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      margin-bottom: 0.4rem;
    }

    .myth-title, .dawah-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .quick-answer, .dawah-summary {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toggle-icon {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
      user-select: none;
    }

    .evidence-box, .dawah-details {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .faq-card.open .evidence-box,
    .dawah-card.open .dawah-details {
      display: block;
    }

    .evidence-block, .wisdom-block {
      background: var(--bg);
      border-left: 3px solid var(--primary);
      padding: 0.85rem 1rem;
      border-radius: 0 8px 8px 0;
      margin-bottom: 0.75rem;
    }

    .wisdom-block p {
      margin-bottom: 0.7rem;
    }

    .wisdom-block p:last-of-type {
      margin-bottom: 0;
    }

    .evidence-label, .wisdom-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .evidence-text {
      font-style: italic;
      margin-bottom: 0.3rem;
    }

    .evidence-ref {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .context-note {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    /* Trivia Section */
    .trivia-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      box-shadow: var(--shadow);
      max-width: 720px;
      margin: 0 auto;
    }

    .trivia-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-btn {
      text-align: left;
      padding: 0.9rem 1.1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .option-btn.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
      border-color: var(--correct-text);
      font-weight: 600;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
      border-color: var(--wrong-text);
    }

    .explanation-panel {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--text);
    }

    .explanation-panel.show {
      display: block;
    }

    .next-btn {
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    [data-theme="dark"] .next-btn {
      color: #0b1120;
    }

    .next-btn.show {
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-style: italic;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

        note: "The Prophet Muhammad (peace be upon him) described modesty as a core part of faith and good character."
      },
      {
        category: "Wisdom of Rulings",
        title: "Avoiding Intoxicants & Riba (Interest)",
        summary: "Islam prohibits alcohol/intoxicants and exploitative interest (riba) in financial dealings.",
        wisdom: [
          "Islam prohibits alcohol and mind-altering intoxicants because clear reasoning, self-control, and sound judgment are central to human responsibility. Intoxicants can cloud decision-making, harm physical and mental health, and strain families and communities.",
          "On the economic side, Islam prohibits riba (interest/usury) in loans and debt exchanges. Charging guaranteed interest on money lent—especially when borrowers are under financial pressure—can trap people in escalating debt without shared effort or real economic value created.",
          "Instead of profiting from debt distress, Islamic finance and ethics encourage transparent trade, fair pricing, partnership where risk and reward are shared fairly, and genuine charity or patience when someone struggles to repay.",
          "Together, these rulings aim to protect human well-being at both the personal and societal levels: keeping the mind clear and keeping economic relationships fair and humane."
        ],
        reference: "Qur'an 5:90–91 & Qur'an 2:275–276",
        note: "Islam pairs these prohibitions with positive encouragement toward honesty in business, fulfilling contracts, and supporting people in financial hardship."
      }
    ];

    // ==========================================
    // 3. DATA: ADD OR EDIT TRIVIA QUESTIONS HERE
    // ==========================================
    const triviaData = [
      {
        question: "Which prophet is mentioned by name the most times in the Qur'an?",
        options: ["Prophet Muhammad (peace be upon him)", "Prophet Moses / Musa (peace be upon him)", "Prophet Abraham / Ibrahim (peace be upon him)", "Prophet Noah / Nuh (peace be upon him)"],
        answer: 1,
        explanation: "Prophet Moses (Musa, peace be upon him) is mentioned by name over 130 times in the Qur'an, highlighting the shared heritage between Abrahamic faiths."
      },
      {
        question: "What does the Arabic word 'Islam' literally mean?",
        options: ["Peaceful submission to the will of God", "A geographic region", "A specific tribe", "Ancient law"],
        answer: 0,
        explanation: "'Islam' comes from the root letters S-L-M, which relate to peace, purity, and voluntary submission to the Creator."
      },
      {
        question: "According to authentic Hadith, what did the Prophet (peace be upon him) say about removing a harmful obstacle from a road?",
        options: ["It has no spiritual reward", "It is a branch of faith and an act of charity", "Only officials should do it", "It only counts on Fridays"],
        answer: 1,
        explanation: "In Sahih Muslim (35), the Prophet (peace be upon him) taught that removing harmful things from the path is one of the branches of faith (Iman) and counts as charity (Sadaqah)."
      },
      {
        question: "Who founded the world's oldest continuously operating degree-granting university (Al-Qarawiyyin) in 859 CE?",
        options: ["Fatima al-Fihri", "Ibn Battuta", "Al-Khwarizmi", "Salahuddin"],
        answer: 0,
        explanation: "Fatima al-Fihri, a Muslim woman in Fez, Morocco, used her inheritance to establish the Al-Qarawiyyin mosque and educational institution in 859 CE."
      },
      {
        question: "Which chapter of the Qur'an is named after Maryam (peace be upon her), the mother of Isa (Jesus)?",
        options: ["Surah Al-Baqarah", "Surah Maryam (Chapter 19)", "Surah Al-Ikhlas", "Surah Yusuf"],
        answer: 1,
        explanation: "Surah Maryam (Chapter 19) is named in honor of Maryam (peace be upon her), who is revered in Islam as one of the purest and most righteous women in human history."
      }
    ];

    // ==========================================
    // 4. DATA: ROTATING FOOTER DU'A LIST
    // ==========================================
    const footerDuas = [
      "O Allah, grant us beneficial knowledge, sincere action, and steady clarity of heart.",
      "O Allah, guide us to what is right, strengthen our patience, and fill our days with calm and purpose.",
      "O Allah, make truth clear to us and help us follow it, and make falsehood clear to us and help us avoid it.",
      "O Allah, protect us from harmful habits, soften our character, and place blessing in our time and effort.",
      "O Allah, ease what feels difficult, grant wisdom in every decision, and keep our intentions pure."
    ];

    let lastDuaIndex = -1;

    // ==========================================
    // 5. APP LOGIC (TABS, THEME, FAQ, DA'WAH, TRIVIA, DU'A)
    // ==========================================
    let selectedCategory = "All";
    let selectedDawahCategory = "All";
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderFooterDua() {
      const duaEl = document.getElementById("footerDua");
      if (!duaEl || !footerDuas.length) return;

      let nextIndex = Math.floor(Math.random() * footerDuas.length);
      if (footerDuas.length > 1 && nextIndex === lastDuaIndex) {
        nextIndex = (nextIndex + 1) % footerDuas.length;
      }
      lastDuaIndex = nextIndex;
      duaEl.textContent = footerDuas[nextIndex];
    }

    function toggleTheme() {
      const body = document.body;
      const btn = document.getElementById("themeToggle");
      const isLight = body.getAttribute("data-theme") === "light";
      body.setAttribute("data-theme", isLight ? "dark" : "light");
      btn.textContent = isLight ? "Light Mode" : "Dark Mode";
    }

    function switchTab(tabName, btnElement) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");

      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.getElementById(`${tabName}-section`).classList.add("active");

      renderFooterDua();
    }

    function renderCategoryPills() {
      const categories = ["All", ...new Set(faqData.map(item => item.category))];
      const container = document.getElementById("categoryPills");
      container.innerHTML = categories.map(cat => `
        <button class="pill ${cat === selectedCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
      `).join("");
    }

    function setCategory(cat) {
      selectedCategory = cat;
      renderCategoryPills();
      renderFAQs();
    }

    function renderFAQs() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const list = document.getElementById("faqList");

      const filtered = faqData.filter(item => {
        const matchesCat = selectedCategory === "All" || item.category === selectedCategory;
        const matchesText =
          item.myth.toLowerCase().includes(query) ||
          item.summary.toLowerCase().includes(query) ||
          item.context.toLowerCase().includes(query);
        return matchesCat && matchesText;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No matching topics found. Try clearing your search filter.</div>`;
        return;
      }

      list.innerHTML = filtered.map((item, idx) => `
        <div class="faq-card" id="card-${idx}">
          <div class="faq-header" onclick="toggleCard(${idx})">
            <div>
              <span class="badge">${item.category}</span>
              <div class="myth-title">${item.myth}</div>
              <p class="quick-answer">${item.summary}</p>
            </div>
            <span class="toggle-icon" id="icon-${idx}">+</span>
          </div>
          <div class="evidence-box">
            <div class="evidence-block">
              <div class="evidence-label">Qur'anic Evidence</div>
              <div class="evidence-text">"${item.quran.text}"</div>
              <div class="evidence-ref">— ${item.quran.ref}</div>
            </div>
            <div class="evidence-block">
              <div class="evidence-label">Sunnah / Hadith Evidence</div>
              <div class="evidence-text">"${item.hadith.text}"</div>
              <div class="evidence-ref">— ${item.hadith.ref}</div>
            </div>
            <p class="context-note"><strong>Historical & Linguistic Note:</strong> ${item.context}</p>
          </div>
        </div>
      `).join("");
    }

    function toggleCard(idx) {
      const card = document.getElementById(`card-${idx}`);
      const icon = document.getElementById(`icon-${idx}`);
      card.classList.toggle("open");
      icon.textContent = card.classList.contains("open") ? "−" : "+";
    }

    function renderDawahCategoryPills() {
      const categories = ["All", ...new Set(dawahData.map(item => item.category))];
      const container = document.getElementById("dawahCategoryPills");
      container.innerHTML = categories.map(cat => `
        <button class="pill ${cat === selectedDawahCategory ? 'active' : ''}" onclick="setDawahCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>
      `).join("");
    }

    function setDawahCategory(cat) {
      selectedDawahCategory = cat;
      renderDawahCategoryPills();
      renderDawah();
    }

    function renderDawah() {
      const query = document.getElementById("dawahSearchInput").value.toLowerCase();
      const list = document.getElementById("dawahList");

      const filtered = dawahData.filter(item => {
        const matchesCat = selectedDawahCategory === "All" || item.category === selectedDawahCategory;
        const wisdomText = Array.isArray(item.wisdom) ? item.wisdom.join(" ") : item.wisdom;
        const matchesText =
          item.title.toLowerCase().includes(query) ||
          item.summary.toLowerCase().includes(query) ||
          wisdomText.toLowerCase().includes(query) ||
          item.note.toLowerCase().includes(query);
        return matchesCat && matchesText;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No matching topics found. Try clearing your search filter.</div>`;
        return;
      }

      list.innerHTML = filtered.map((item, idx) => {
        const paragraphs = Array.isArray(item.wisdom) ? item.wisdom : [item.wisdom];
        const paragraphsHtml = paragraphs.map(p => `<p>${p}</p>`).join("");

        return `
          <div class="dawah-card" id="dawah-card-${idx}">
            <div class="dawah-header" onclick="toggleDawahCard(${idx})">
              <div>
                <span class="badge">${item.category}</span>
                <div class="dawah-title">${item.title}</div>
                <p class="dawah-summary">${item.summary}</p>
              </div>
              <span class="toggle-icon" id="dawah-icon-${idx}">+</span>
            </div>
            <div class="dawah-details">
              <div class="wisdom-block">
                <div class="wisdom-label">Reasoning &amp; Wisdom (Hikmah)</div>
                ${paragraphsHtml}
                <div class="evidence-ref" style="margin-top: 0.65rem;">— ${item.reference}</div>
              </div>
              <p class="context-note"><strong>Note:</strong> ${item.note}</p>
            </div>
          </div>
        `;
      }).join("");
    }

    function toggleDawahCard(idx) {
      const card = document.getElementById(`dawah-card-${idx}`);
      const icon = document.getElementById(`dawah-icon-${idx}`);
      card.classList.toggle("open");
      icon.textContent = card.classList.contains("open") ? "−" : "+";
    }

    function renderTrivia() {
      const container = document.getElementById("triviaContainer");

      if (currentQuestion >= triviaData.length) {
        container.innerHTML = `
          <div style="text-align: center; padding: 1rem 0;">
            <h2>Quiz Complete!</h2>
            <p style="font-size: 1.2rem; margin: 1rem 0;">You scored <strong>${score} out of ${triviaData.length}</strong>.</p>
            <p style="color: var(--muted); margin-bottom: 1.5rem;">Want to test your knowledge again or explore more evidences in the FAQ?</p>
            <button class="next-btn show" onclick="restartTrivia()">Play Again</button>
          </div>
        `;
        return;
      }

      const q = triviaData[currentQuestion];
      answered = false;

      container.innerHTML = `
        <div class="trivia-top">
          <span>Question ${currentQuestion + 1} of ${triviaData.length}</span>
          <span>Score: ${score}</span>
        </div>
        <div class="question-text">${q.question}</div>
        <div class="options-grid">
          ${q.options.map((opt, i) => `
            <button class="option-btn" id="opt-${i}" onclick="selectOption(${i})">${opt}</button>
          `).join("")}
        </div>
        <div class="explanation-panel" id="explanationBox">
          <strong>Explanation:</strong> ${q.explanation}
        </div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
          ${currentQuestion === triviaData.length - 1 ? "See Final Score" : "Next Question →"}
        </button>
      `;
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = triviaData[currentQuestion];
      const buttons = document.querySelectorAll(".option-btn");

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.answer) {
          btn.classList.add("correct");
        } else if (i === selectedIdx) {
          btn.classList.add("wrong");
        }
      });

      if (selectedIdx === q.answer) {
        score++;
      }

      document.getElementById("explanationBox").classList.add("show");
      document.getElementById("nextBtn").classList.add("show");
    }

    function nextQuestion() {
      currentQuestion++;
      renderTrivia();
    }

    function restartTrivia() {
      currentQuestion = 0;
      score = 0;
      renderTrivia();
    }

    // Initialize Page
    renderCategoryPills();
    renderFAQs();
    renderDawahCategoryPills();
    renderDawah();
    renderTrivia();
    renderFooterDua();
  </script>
</body>
</html>
