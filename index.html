<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarifying Islam — Myths, Evidence & Trivia</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: #ccfbf1;
      --accent: #b45309;
      --correct-bg: #dcfce7;
      --correct-text: #166534;
      --wrong-bg: #fee2e2;
      --wrong-text: #991b1b;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #2dd4bf;
      --primary-hover: #14b8a6;
      --primary-soft: rgba(45, 212, 191, 0.15);
      --accent: #fbbf24;
      --correct-bg: rgba(22, 101, 52, 0.35);
      --correct-text: #86efac;
      --wrong-bg: rgba(153, 27, 27, 0.35);
      --wrong-text: #fca5a5;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .tab-btn, .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #0b1120;
      border-color: var(--primary);
    }

    [data-theme="light"] .tab-btn.active {
      color: #ffffff;
    }

    .tab-btn:hover:not(.active), .theme-btn:hover {
      border-color: var(--primary);
    }

    .hero {
      max-width: 960px;
      margin: 2rem auto 1.5rem;
      padding: 0 1.25rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .hero p {
      color: var(--muted);
      max-width: 640px;
      margin: 0 auto;
    }

    main {
      max-width: 960px;
      margin: 0 auto 4rem;
      padding: 0 1.25rem;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* FAQ Controls */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pill {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* FAQ Cards */
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .faq-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }

    .faq-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
